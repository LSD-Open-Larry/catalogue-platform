# Wave 3 - admission and supply-chain policies, from policies/.
#
# policies/kyverno-verify-images.yaml needs Kyverno installed (add its
# Subscription or Helm Application to wave 0). If you use Red Hat ACS
# instead, delete that file and keep ACS policy as code here (ACS policy CRs),
# or follow policies/ACS-POLICIES.md. Argo CD ignores the .md file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: catalogue-platform
spec:
  project: platform
  source:
    repoURL: https://github.com/LSD-Open-Larry/catalogue-platform.git
    targetRevision: main
    path: policies
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    # Must be a namespace allowed by the "platform" project. ClusterPolicies are cluster-scoped; this is only the default.
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}