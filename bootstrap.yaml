# =============================================================================
# bootstrap.yaml - the ONE manifest applied by hand.
#
#   oc apply -f bootstrap.yaml
#
# It creates the root Application "cluster-bootstrap", which syncs the apps/
# folder of the catalogue-platform repo. Every Application in apps/ (operators,
# cluster config, CI/CD, policies, and finally catalogue-config's own app of
# apps) is then created and kept in sync by Argo CD, in sync-wave order:
#
#   cluster-bootstrap                      (this file)
#    └─ catalogue-platform/apps/
#        ├─ 00-projects.yaml        AppProject "platform"
#        ├─ 10-operators.yaml       -> operators/
#        ├─ 20-cluster-config.yaml  -> cluster/
#        ├─ 30-cicd.yaml            -> cicd/
#        ├─ 40-policies.yaml        -> policies/
#        └─ 50-catalogue.yaml       -> catalogue-config repo, path apps/
#
# Before applying (one-time, cannot itself be GitOps):
#   1. OpenShift GitOps operator installed (default instance in openshift-gitops).
#   2. Argo CD can read the repos. For private repos, create a repository
#      secret once (never commit it):
#        oc -n openshift-gitops create secret generic catalogue-platform-repo \
#          --from-literal=type=git \
#          --from-literal=url=https://github.com/LSD-Open-Larry/catalogue-platform.git \
#          --from-literal=username=<user> --from-literal=password=<token>
#        oc -n openshift-gitops label secret catalogue-platform-repo \
#          argocd.argoproj.io/secret-type=repository
#      (repeat for catalogue-config, or use a repo-creds secret for the org URL)
#   3. Argo CD's controller may manage cluster-scoped resources. Lab only:
#        oc adm policy add-cluster-role-to-user cluster-admin \
#          -z openshift-gitops-argocd-application-controller -n openshift-gitops
#      Production: bind a narrower ClusterRole instead.
#   4. Patch the Argo CD instance (Application health check + RBAC):
#        oc patch argocd openshift-gitops -n openshift-gitops --type merge \
#          --patch-file argocd-instance-patch.yaml
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-bootstrap
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: catalogue-platform
  # No resources finalizer on purpose: deleting the root by mistake must not
  # cascade-delete the whole platform and every environment.
spec:
  # "default" because the "platform" AppProject does not exist yet - it is
  # created by this application (apps/00-projects.yaml, wave -1).
  project: default
  source:
    repoURL: https://github.com/LSD-Open-Larry/catalogue-platform.git
    targetRevision: main
    path: apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
    retry:
      # Child apps wait on operators and CRDs installed by earlier waves,
      # so keep retrying instead of failing the first attempt.
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
